name: Daily Electric Vehicle Data Crawler

on:
  schedule:
    # 매일 한국시간 오전 9시에 실행 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행도 가능하도록 설정
  push:
    branches: [ main ]
    paths:
      - 'comprehensive_crawler.py'
      - '.github/workflows/daily-crawler.yml'

jobs:
  crawl-and-commit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 호환되는 버전으로 의존성 설치
        pip install numpy==1.24.3
        pip install pandas==2.0.3
        pip install requests==2.31.0
        pip install beautifulsoup4==4.12.2
        pip install lxml==4.9.3
        pip install selenium==4.15.0
        pip install webdriver-manager==4.0.1
        # 설치된 패키지 버전 확인
        echo "설치된 패키지 버전:"
        pip list | grep -E "(numpy|pandas|selenium|requests|beautifulsoup4|lxml|webdriver-manager)"
    
    - name: Install Chrome and ChromeDriver
      run: |
        # Chrome 120 안정 버전 설치 (ChromeDriver 호환성 보장)
        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        
        # Chrome 설치 (버전 고정 시도)
        sudo apt-get install -y google-chrome-stable=120.0.6099.109-1 || sudo apt-get install -y google-chrome-stable
        
        # Chrome 버전 확인
        CHROME_VERSION=$(google-chrome --version | cut -d' ' -f3)
        echo "Chrome version: $CHROME_VERSION"
        
        # ChromeDriver 버전 동적 확인 및 설치
        echo "ChromeDriver 버전 동적 확인"
        
        # Chrome 메이저 버전 추출
        CHROME_MAJOR=$(echo $CHROME_VERSION | cut -d'.' -f1)
        echo "Chrome major version: $CHROME_MAJOR"
        
        # ChromeDriver 버전 확인 (여러 저장소와 버전 시도)
        CHROMEDRIVER_VERSION=""
        CHROMEDRIVER_URL=""
        
        # 새로운 ChromeDriver 저장소 시도 (Chrome 115+)
        echo "새로운 ChromeDriver 저장소 확인 중..."
        NEW_CHROMEDRIVER_URL="https://edgedl.me.gvt1.com/edgedl/chrome/chrome-for-testing/115.0.5790.102/linux64/chromedriver-linux64.zip"
        if curl -s --head "$NEW_CHROMEDRIVER_URL" | head -n 1 | grep -q "200 OK"; then
            CHROMEDRIVER_VERSION="115.0.5790.102"
            CHROMEDRIVER_URL="$NEW_CHROMEDRIVER_URL"
            echo "새로운 저장소에서 ChromeDriver 발견: $CHROMEDRIVER_VERSION"
        else
            # 기존 저장소에서 오래된 버전들 시도
            echo "기존 저장소에서 ChromeDriver 확인 중..."
            for version in "114.0.5735.90" "113.0.5672.63" "112.0.5615.49" "111.0.5563.64" "110.0.5481.77"; do
                echo "ChromeDriver 버전 $version 확인 중..."
                if curl -s --head "https://chromedriver.storage.googleapis.com/${version}/chromedriver_linux64.zip" | head -n 1 | grep -q "200 OK"; then
                    CHROMEDRIVER_VERSION=$version
                    CHROMEDRIVER_URL="https://chromedriver.storage.googleapis.com/${version}/chromedriver_linux64.zip"
                    echo "기존 저장소에서 ChromeDriver 발견: $CHROMEDRIVER_VERSION"
                    break
                fi
            done
        fi
        
        if [ -z "$CHROMEDRIVER_VERSION" ]; then
            echo "사용 가능한 ChromeDriver 버전을 찾을 수 없습니다"
            exit 1
        fi
        
        echo "ChromeDriver version: $CHROMEDRIVER_VERSION"
        echo "Chrome 버전: $CHROME_VERSION (ChromeDriver $CHROMEDRIVER_VERSION와 호환)"
        
        # ChromeDriver 다운로드
        wget -O /tmp/chromedriver.zip "$CHROMEDRIVER_URL"
        
        # 압축 해제
        sudo unzip /tmp/chromedriver.zip -d /tmp/
        
        # ChromeDriver 실행 파일 찾기 및 설치
        CHROMEDRIVER_FILE=$(find /tmp -name "chromedriver" -type f | head -1)
        if [ -n "$CHROMEDRIVER_FILE" ]; then
            echo "ChromeDriver 파일 발견: $CHROMEDRIVER_FILE"
            sudo mv "$CHROMEDRIVER_FILE" /usr/local/bin/chromedriver
            sudo chmod +x /usr/local/bin/chromedriver
            echo "ChromeDriver 설치 완료"
            
            # 버전 확인
            /usr/local/bin/chromedriver --version
        else
            echo "ChromeDriver 실행 파일을 찾을 수 없습니다"
            exit 1
        fi
    
    - name: Run crawler
      run: |
        echo "크롤러 실행 시작..."
        echo "현재 디렉토리: $(pwd)"
        echo "Python 버전: $(python --version)"
        echo "파일 목록:"
        ls -la
        echo "data 디렉토리 확인:"
        ls -la data/ || echo "data 디렉토리가 없습니다"
        
        python comprehensive_crawler.py 2>&1
        exit_code=$?
        echo "크롤러 실행 완료. 종료 코드: $exit_code"
        
        echo "실행 후 data 디렉토리 확인:"
        ls -la data/ || echo "data 디렉토리가 없습니다"
        
        if [ $exit_code -ne 0 ]; then
          echo "크롤러 실행 실패"
          exit $exit_code
        fi
      env:
        DISPLAY: ':99'
        GITHUB_ACTIONS: 'true'
    
    - name: Configure Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
    
    - name: Commit and push changes
      run: |
        # 변경사항이 있는지 확인
        if git diff --quiet && git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git add data/
          git commit -m "자동 업데이트: $(date '+%Y-%m-%d %H:%M:%S')"
          git push
        fi
