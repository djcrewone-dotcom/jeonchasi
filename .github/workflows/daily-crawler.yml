name: Daily Electric Vehicle Data Crawler

on:
  schedule:
    # 매일 한국시간 오전 9시에 실행 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행도 가능하도록 설정
  push:
    branches: [ main ]
    paths:
      - 'comprehensive_crawler.py'
      - '.github/workflows/daily-crawler.yml'

jobs:
  crawl-and-commit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 호환되는 버전으로 의존성 설치
        pip install numpy==1.24.3
        pip install pandas==2.0.3
        pip install requests==2.31.0
        pip install beautifulsoup4==4.12.2
        pip install lxml==4.9.3
        pip install selenium==4.15.0
        pip install webdriver-manager==4.0.1
        # 설치된 패키지 버전 확인
        echo "설치된 패키지 버전:"
        pip list | grep -E "(numpy|pandas|selenium|requests|beautifulsoup4|lxml|webdriver-manager)"
    
    - name: Install Chrome and ChromeDriver
      run: |
        # Chrome 최신 버전 설치
        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        
        # Chrome 최신 버전 설치
        sudo apt-get install -y google-chrome-stable
        
        # Chrome 버전 확인
        CHROME_VERSION=$(google-chrome --version | cut -d' ' -f3)
        echo "Chrome version: $CHROME_VERSION"
        
        # webdriver-manager를 사용한 ChromeDriver 자동 설치
        echo "webdriver-manager를 사용한 ChromeDriver 자동 설치"
        
        python3 -c "
import os
import sys
os.environ['WDM_LOG_LEVEL'] = '0'
os.environ['WDM_LOCAL'] = '1'

try:
    from webdriver_manager.chrome import ChromeDriverManager
    from selenium import webdriver
    from selenium.webdriver.chrome.options import Options
    from selenium.webdriver.chrome.service import Service
    
    print('webdriver-manager로 ChromeDriver 설치 중...')
    driver_path = ChromeDriverManager().install()
    print(f'ChromeDriver 설치 완료: {driver_path}')
    
    chrome_options = Options()
    chrome_options.add_argument('--headless')
    chrome_options.add_argument('--no-sandbox')
    chrome_options.add_argument('--disable-dev-shm-usage')
    chrome_options.add_argument('--disable-gpu')
    chrome_options.add_argument('--window-size=1920,1080')
    
    service = Service(driver_path)
    driver = webdriver.Chrome(service=service, options=chrome_options)
    driver.get('https://www.google.com')
    title = driver.title
    print(f'ChromeDriver 테스트 성공: {title}')
    driver.quit()
    print('ChromeDriver 설치 및 테스트 완료')
    
except Exception as e:
    print(f'ChromeDriver 설치 실패: {e}')
    import traceback
    traceback.print_exc()
    sys.exit(1)
"
    
    - name: Run crawler
      run: |
        echo "크롤러 실행 시작..."
        echo "현재 디렉토리: $(pwd)"
        echo "Python 버전: $(python --version)"
        echo "파일 목록:"
        ls -la
        echo "data 디렉토리 확인:"
        ls -la data/ || echo "data 디렉토리가 없습니다"
        
        python comprehensive_crawler.py 2>&1
        exit_code=$?
        echo "크롤러 실행 완료. 종료 코드: $exit_code"
        
        echo "실행 후 data 디렉토리 확인:"
        ls -la data/ || echo "data 디렉토리가 없습니다"
        
        if [ $exit_code -ne 0 ]; then
          echo "크롤러 실행 실패"
          exit $exit_code
        fi
      env:
        DISPLAY: ':99'
        GITHUB_ACTIONS: 'true'
    
    - name: Configure Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
    
    - name: Commit and push changes
      run: |
        # 변경사항이 있는지 확인
        if git diff --quiet && git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git add data/
          git commit -m "자동 업데이트: $(date '+%Y-%m-%d %H:%M:%S')"
          git push
        fi
