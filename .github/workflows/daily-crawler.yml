name: Daily Electric Vehicle Data Crawler

on:
  schedule:
    # 매일 한국시간 오전 9시에 실행 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행도 가능하도록 설정
  push:
    branches: [ main ]
    paths:
      - 'comprehensive_crawler.py'
      - '.github/workflows/daily-crawler.yml'

jobs:
  crawl-and-commit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install Chrome and ChromeDriver
      run: |
        # Chrome 설치
        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        
        # Chrome 버전 확인
        CHROME_VERSION=$(google-chrome --version | cut -d' ' -f3)
        echo "Chrome version: $CHROME_VERSION"
        
        # ChromeDriver 설치 (webdriver-manager 사용하도록 설정)
        export CHROME_VERSION_MAJOR=$(echo $CHROME_VERSION | cut -d'.' -f1)
        echo "Chrome major version: $CHROME_VERSION_MAJOR"
        
        # ChromeDriver 다운로드 및 설치
        CHROMEDRIVER_URL="https://chromedriver.storage.googleapis.com/LATEST_RELEASE_${CHROME_VERSION_MAJOR}"
        echo "ChromeDriver URL: $CHROMEDRIVER_URL"
        CHROMEDRIVER_VERSION=$(curl -s "$CHROMEDRIVER_URL")
        echo "ChromeDriver version: $CHROMEDRIVER_VERSION"
        
        # ChromeDriver 다운로드
        wget -O /tmp/chromedriver.zip "https://chromedriver.storage.googleapis.com/${CHROMEDRIVER_VERSION}/chromedriver_linux64.zip"
        sudo unzip /tmp/chromedriver.zip -d /usr/local/bin/
        sudo chmod +x /usr/local/bin/chromedriver
        
        # 설치 확인
        echo "ChromeDriver 설치 확인:"
        /usr/local/bin/chromedriver --version
    
    - name: Run crawler
      run: |
        echo "크롤러 실행 시작..."
        python comprehensive_crawler.py
        exit_code=$?
        echo "크롤러 실행 완료. 종료 코드: $exit_code"
        if [ $exit_code -ne 0 ]; then
          echo "크롤러 실행 실패"
          exit $exit_code
        fi
      env:
        DISPLAY: ':99'
        GITHUB_ACTIONS: 'true'
    
    - name: Configure Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
    
    - name: Commit and push changes
      run: |
        # 변경사항이 있는지 확인
        if git diff --quiet && git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git add data/
          git commit -m "자동 업데이트: $(date '+%Y-%m-%d %H:%M:%S')"
          git push
        fi
